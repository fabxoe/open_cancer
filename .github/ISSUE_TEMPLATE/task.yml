name: 일반 작업
description: 문서, 구조, 리팩터링, 자동화 등 독립 작업
title: "[TASK] "
labels:
  - task
body:
  - type: input
    id: owner
    attributes:
      label: 담당자
      placeholder: GitHub ID
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 목적과 배경
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함할 변경과 제외할 변경을 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      value: |
        - [ ] 구현 완료
        - [ ] 테스트 완료
        - [ ] 관련 문서 갱신
    validations:
      required: true
