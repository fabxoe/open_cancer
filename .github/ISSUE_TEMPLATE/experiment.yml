name: 모델 실험
description: 새로운 모델, 피처, split, 앙상블 또는 후처리 실험
title: "[EXP] "
labels:
  - experiment
body:
  - type: markdown
    attributes:
      value: |
        제목만 작성해도 됩니다. Issue가 생성되면 번호로 실험 ID가 자동 결정됩니다.
        예: Issue #12 → EXP-012. 실험 ID를 직접 입력하거나 예약하지 않습니다.

        담당자는 Issue 작성자·Assignee로 확인합니다. 기본 metric, 공용 split,
        재현성 기록과 산출물 규칙은 `PROJECT_CONTEXT.md`의 기본값을 사용합니다.
  - type: textarea
    id: notes
    attributes:
      label: 실험 메모 (선택)
      description: 가설, 비교할 부모 실험, 특별히 바꿀 값이 있을 때만 자유롭게 적습니다. 비워도 됩니다.
      placeholder: |
        예: XGBoost baseline을 먼저 확인
        예: EXP-003과 비교해 max_depth만 변경
    validations:
      required: false
