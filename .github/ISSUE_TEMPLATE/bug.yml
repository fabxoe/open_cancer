name: 버그
description: 재현 가능한 오류와 잘못된 결과 수정
title: "[BUG] "
labels:
  - bug
body:
  - type: input
    id: owner
    attributes:
      label: 담당자
      placeholder: GitHub ID
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 실제 결과와 기대 결과를 함께 적습니다.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 환경, 입력, 명령과 오류 로그를 적습니다.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 실험, 지표, 제출, 재현성에 미치는 영향을 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      value: |
        - [ ] 실패 테스트 추가
        - [ ] 수정 후 전체 테스트 통과
        - [ ] 영향받은 실험 기록 검토
    validations:
      required: true
