[project]
name = "open-cancer"
version = "0.1.0"
description = "Reproducible cancer subtype classification from genomic mutation profiles"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=6.29",
    "imbalanced-learn>=0.14",
    "jsonschema>=4.23",
    "jupyterlab>=4.2",
    "koreanize-matplotlib>=0.1.1",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pytest>=8.3",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
    "xgboost>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_cancer"]

[dependency-groups]
experiment = [
    "catboost>=1.2",
    "lightgbm>=4.5",
    "optuna>=4.1",
    "shap>=0.46",
    "torch>=2.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
