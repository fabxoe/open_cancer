model:
  class: catboost.CatBoostClassifier
  parameters:
    iterations: 400
    depth: 6
    learning_rate: 0.05
    l2_leaf_reg: 3.0
    border_count: 32
    bootstrap_type: Bernoulli
    subsample: 0.8
    rsm: 0.1
    thread_count: 10
    early_stopping_rounds: 50
    allow_writing_files: false
training:
  balanced_sample_weight: true
  command: uv run python scripts/run_exp459_catboost_exp374.py
preflight:
  attempts:
  - source_commit: 64a7d8a16bfb2df290f822baca9163b53b90d47a
    parameters:
      iterations: 100
      depth: 6
      rsm: 0.1
      border_count: 32
      thread_count: 10
    fold: 0
    measured_seconds: 129.9
    seconds_per_iteration: 1.299
    hardware: Apple M1 Pro (CPU only, no CUDA/GPU available)
    reason: No GPU available in this execution environment (unlike EXP-127, which
      needed RunPod RTX 4090 because CPU depth=8/iterations=1000 did not complete
      one fold within 30 minutes). Measured 1.30s/iteration at depth=6/rsm=0.1/border_count=32/thread_count=10
      on the EXP-374 feature matrix (~4,960 x 35,181 per fold). iterations=400 is
      chosen so 5 folds complete in roughly 45 minutes, keeping this within a single
      CPU-bounded session instead of requiring GPU compute.
