    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.0
    reg_lambda: 1.0
    eval_metric: mlogloss
    early_stopping_rounds: 30
    tree_method: hist
    device: cpu
    n_jobs: 8
    verbosity: 0
