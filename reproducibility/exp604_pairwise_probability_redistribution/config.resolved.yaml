optimism_bias_disclosure: 'Same as EXP-233/276/515: EXP-374 (baseline) selected each
  outer fold''s checkpoint iteration by maximizing Macro F1 on that same fold''s validation
  rows. This experiment''s inner-fold early stopping reuses the inner holdout as eval_set,
  the same established pattern used throughout this project. Promotion beyond a Local
  diagnostic requires additional stability confirmation per PROJECT_CONTEXT.md''s
  checkpoint-selection policy; this experiment does not claim that confirmation on
  its own.'
