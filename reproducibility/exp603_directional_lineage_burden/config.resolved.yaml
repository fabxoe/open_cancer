          organ''s drivers into one undirected group). Four fixed gene lists: (1)
          kirc_lineage (VHL, MTOR) - defining/associated ccRCC(KIRC) driver genes
          on the VHL-HIF-mTOR axis; (2) kipan_nonccrcc_lineage (TSC1, TSC2, MET) -
          drivers associated with non-clear-cell renal tumors that fall inside the
          heterogeneous KIPAN superclass (papillary RCC''s defining MET driver; TSC1/TSC2-associated
          non-ccRCC renal tumors); (3) lgg_idh_lineage (IDH1, IDH2, ATRX, TP53) -
          WHO CNS5 IDH-mutant astrocytoma co-mutation signature; (4) gbm_idh_wildtype_lineage
          (NF1, PTEN, EGFR) - WHO CNS5 / cIMPACT-NOW IDH-wildtype GBM molecular signature
          (EGFR amplification/mutation, PTEN loss, NF1 loss). Gene-to-group assignment
          is fixed from this independent literature, not from this competition''s
          per-class mutation frequencies, SUBCLASS labels, or Public LB.'
        version: 1.0.0
        license: N/A - hand-curated gene-lineage membership derived from published
          cancer-genetics literature (WHO CNS5 IDH-based glioma classification; WHO
          renal tumor classification VHL/ccRCC and MET/papillary-RCC driver associations);
