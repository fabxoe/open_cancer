run_mode: experiment
record_role: official
experiment_id: EXP-522
issue_number: 522
slug: parser_v4_class_likelihood
parent_experiment: EXP-374
component_experiments: []
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  parent: exp374_stop_isoform_residue_mask
  parser_v4_patient_semantic_vector:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    include_directly_in_model: false
  class_profile:
    enabled: true
    definition_version: 1.0.0
    method: mean_log_likelihood
    fit_scope: outer_train_only
    output_dimension: 26
    alpha: 1.0
    include_class_prior: false
    zero_vector_policy: all_zero_scores
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - exp374_stop_isoform_residue_mask
    - parser_v4_26_class_mean_log_likelihood_profile
notes: >-
  Issue #522. Independent C-stage comparison with EXP-521. EXP-374 and the
  66,242-dimensional parser-v4 patient semantic vector are fixed. Each class
  token distribution is estimated only on the current outer-train partition
  with alpha=1 additive smoothing; outer-validation and test are transform-only.
  Class priors are excluded so this experiment measures semantic likelihood,
  not label prevalence. Test and Public LB do not select any setting.
comparison_metrics_path: reports/exp374_stop_isoform_residue_mask/metrics.json
