run_mode: experiment
record_role: official
experiment_id: EXP-628
issue_number: 628
slug: exp628_nested_blend_weight_exp527_exp596
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
ensemble:
  method: nested_leave_one_fold_out_weight_search
  weights_fixed_before_evaluation: true
  components:
    - experiment_id: EXP-527
      oof_probability_path: oof/exp527_parser_v4_class_cosine_loo.csv
      test_probability_path: preds/exp527_parser_v4_class_cosine_loo_test_proba.csv
      metrics_path: reports/exp527_parser_v4_class_cosine_loo/metrics.json
      resolved_config_path: reproducibility/exp527_parser_v4_class_cosine_loo/config.resolved.yaml
    - experiment_id: EXP-596
      oof_probability_path: oof/exp596_random_forest_v1.csv
      test_probability_path: preds/exp596_random_forest_v1_test_proba.csv
      metrics_path: reports/exp596_random_forest_v1/metrics.json
      resolved_config_path: reproducibility/exp596_random_forest_v1/config.resolved.yaml
  nested_weight_selection:
    candidate_grid_weight_527: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35,
      0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
    per_fold_selection_scope: other_four_outer_folds_only
    weight_aggregation: mean_snap_to_grid
    instability_threshold_range: 0.30
submission:
  test_path: data/raw/test.csv
  sample_submission_path: data/raw/sample_submission.csv
acceptance:
  comparison_experiment: EXP-623
  minimum_macro_f1_delta: 0.001
  maximum_fold_std_increase: 0.002
  require_no_clear_log_loss_regression: true
notes: >-
  Issue #628. EXP-623(0.5/0.5 고정 블렌드)의 explore-mode 참고 스윕에서 EXP-527
  가중치 0.4/0.6이 0.5/0.5보다 OOF Macro F1이 근소하게 높았지만, 같은 OOF에서
  사후에 찾은 값이라 채택 근거로 쓰지 않았다(History EXP-623 섹션). 이 실험은
  look-ahead 없이 같은 결론을 재현할 수 있는지 leave-one-outer-fold-out nested
  weight search로 확인한다. 각 outer fold의 가중치는 나머지 4개 fold의 OOF만
  보고 사전 고정 grid(0.00~1.00, 0.05 간격)에서 선택하며, fold 자신의 라벨은
  가중치 선택에 전혀 사용하지 않는다. 배포용 최종 가중치는 5개 fold가 선택한
  값의 평균을 grid에 스냅한 값으로, 이 집계 규칙도 실행 전 고정했다.
  fold별 선택 가중치가 candidate_grid 범위의 30%(instability_threshold_range)
  이상 흩어지면 최적 가중치 개념이 불안정하다고 보고 EXP-623(0.5/0.5) 유지를
  권고한다. Public LB와 test 분포는 가중치나 집계 규칙 선택에 사용하지 않는다.
