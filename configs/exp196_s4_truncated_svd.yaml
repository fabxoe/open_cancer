run_mode: experiment
record_role: official
experiment_id: EXP-196
issue_number: 196
slug: exp196_s4_truncated_svd
parent_experiment: EXP-094
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
baseline:
  feature_spec: v1
  metrics_path: reports/exp094_feature_spec_v1/metrics.json
projection:
  method: truncated_svd
  scope: outer_fold_train_only
  input: raw_mutation_presence
  n_components: 256
  algorithm: randomized
  n_iter: 5
  passthrough_prefixes: [sample__, hotspot__]
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
acceptance:
  min_macro_f1_delta: 0.001
  max_fold_std_delta: 0.002
  max_per_class_f1_drop: 0.05
notes: >-
  S4 pre-registered low-dimensional comparator. TruncatedSVD is fit independently
  on each outer-train fold's 4,384 raw mutation-presence columns. Validation and
  test are transformed by the saved fold projector. Sample aggregates and fixed
  hotspot columns pass through unchanged. Test and Public LB never fit or select
  the projection or checkpoint.

