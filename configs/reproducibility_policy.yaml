required_artifact_kinds:
  - checkpoint
  - oof_probability
  - test_probability
  - submission
  - resolved_config
  - release_bundle

accepted_kind_aliases:
  submission:
    - original_submission
  test_probability:
    - reproduced_test_probabilities

legacy_exceptions:
  EXP-003:
    reason: 표준 번들 정책 도입 전 Release이며 OOF와 제출 파일 storage URI가 없다.
    follow_up: 다음 최종 제출 후보 선정 전에 v2 번들로 교체한다.
  EXP-021:
    reason: 표준 번들 정책 도입 전 제출했고 checkpoint와 manifest가 공유되지 않았다.
    follow_up: EXP-021 재현성 복구 작업에서 정리한다.
  EXP-026:
    reason: 표준 번들 정책 도입 전 제출했고 checkpoint와 manifest가 공유되지 않았다.
    follow_up: EXP-026 재현성 복구 작업에서 정리한다.
  EXP-031:
    reason: 재현 번들 정책이 main에 병합되기 전에 진행 중인 PR에서 제출했으며 원 Windows checkpoint와 test 확률이 보관되지 않았다.
    follow_up: 독립 재학습 불일치를 FAILED로 기록했다. 최종 후보로 사용하려면 새 Issue에서 clean 실행 후 제출 전에 번들을 보관한다.
  EXP-030:
    reason: 번들 정책 도입 후 제출됐지만 원 WSL checkpoint, OOF와 test 확률이 GitHub Release에 보관되지 않아 현재 clone에서 제출 번들을 구성할 수 없다.
    follow_up: 원 실행자가 WSL 산출물을 exp-030-repro-v1 Release로 보관하고 manifest의 storage URI를 갱신한 뒤 이 임시 예외를 제거한다.
