run_mode: experiment
record_role: official
experiment_id: EXP-440
issue_number: 440
slug: egfr_nfe2l2_hotspot
parent_experiment: EXP-374
component_experiments: [EXP-229, EXP-296, EXP-313, EXP-369, EXP-374]
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mutation_type:
    enabled: true
    parser:
      name: stop_notation_invariant_v2
      definition_version: 2.1.0
      equivalent_stop_alternates: ["*", X, Ter]
      other_v1_semantics_preserved: true
  robust_aggregates:
    - sample__mutated_gene_count_log1p
    - sample__total_variant_count_log1p
    - sample__multi_variant_gene_count_log1p
  residue_position:
    enabled: true
    aggregates: [max]
    missing_policy: zero
    complex_tokens: include
    transform: raw
    isoform_semantic_mask:
      enabled: true
      manifest_path: knowledge/ensembl_isoform_annotation_v1.json
      manifest_sha256: 568ea31f5b7fc7ff47d181fe552d39f3b9185f8d0a76cbb2a49d06be022d5bc0
      annotation_cache_path: data/external/ensembl_release_116/competition_gene_isoform_index.json
      annotation_cache_sha256: b9565339f1755d5b07e782c39064207310fa6c254b2e915a15492f4f38903daa
      trusted_categories:
        - CANONICAL_MATCH
        - MANE_MATCH
        - OTHER_ISOFORM_MATCH
      masked_categories:
        - COMPLEX_OR_UNMAPPABLE
        - OUTSIDE_ALL_KNOWN_ISOFORMS
        - POSITION_VALID_REF_MISMATCH
hotspots:
  table: extended_34
  evidence_scope: additions_15
  minimum_matching_train_rows: 5
  stop_notation_normalization: true
external_knowledge:
  file: knowledge/canonical_pathways_sanchez_vega_v1.json
  organizer_approval_reference: https://github.com/fabxoe/open_cancer/issues/96#issuecomment-5151028180
  source_commit: 7d29965de6ac8d0c6ec18c383f6dff8a48d562e7
  source_sha256: a625675d03fa314eb27f3ab731524de13621a35aecd8edb7c67878f2d89ae07a
abc_families:
  fixed_pathway_burden:
    enabled: true
    definition_version: 2.1.0
    fit_scope: stateless
    groups: 10
    values: [mutated_gene_count, lof_gene_count]
    stop_notation_normalization: true
    output_dimension: 20
  pathway_mutation_type_composition:
    enabled: true
    definition_version: 2.1.0
    fit_scope: stateless
    groups: 10
    values:
      - missense_gene_count
      - synonymous_gene_count
      - nonsense_gene_count
      - frameshift_gene_count
      - complex_gene_count
    stop_notation_normalization: true
    candidate_output_dimension: 50
    semantic_equivalence_filter: fold_train_against_feature_spec_v1
  egfr_nfe2l2_hotspot:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    source_issue: 440
    burden_screening_reference: reports/analysis/hotspot_screening_burden_control.md
    candidates:
      - {gene: EGFR, position: 289, reference_aa: A, dominant_class: GBMLGG, train_n: 19, burden_ratio: 1.368}
      - {gene: EGFR, position: 598, reference_aa: G, dominant_class: GBMLGG, train_n: 13, burden_ratio: 1.345}
      - {gene: NFE2L2, position: 79, reference_aa: E, dominant_class: HNSC, train_n: 4, burden_ratio: 1.118}
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - exp374_stop_isoform_residue_mask_feature_spec
    - egfr_a289_g598_nfe2l2_e79_hotspot
notes: >-
  Issue #440. EXP-374 model, folds, seed, checkpoint policy, stop notation
  parser, Ensembl isoform mask, pathways and hotspot-34 are held fixed. The
  sole change is three additive-only, stateless, position-level hotspot
  columns (hotspot__EGFR_289, hotspot__EGFR_598, hotspot__NFE2L2_79) from the
  DominoEffect screening backlog, all confirmed burden-clean in
  reports/analysis/hotspot_screening_burden_control.md ("결과 4 -- 대기열").
  Position matching only touches simple substitution tokens (position +
  reference amino acid), unaffected by stop-notation normalization -- same
  parser-invariant mechanism as EXTENDED_HOTSPOTS and CTNNB1 D32/S33
  (EXP-296). Target, test distribution and Public LB do not define the
  candidates or thresholds.
comparison_metrics_path: reports/exp374_stop_isoform_residue_mask/metrics.json
