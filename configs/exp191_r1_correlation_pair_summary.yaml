run_mode: experiment
record_role: official
experiment_id: EXP-191
issue_number: 191
slug: exp191_r1_correlation_pair_summary
parent_experiment: EXP-094
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
baseline:
  feature_spec: v1
  metrics_path: reports/exp094_feature_spec_v1/metrics.json
pair_selection:
  method: phi_jaccard_greedy_mutation_presence_pairs
  scope: outer_fold_train_only
  phi_min: 0.25
  jaccard_min: 0.15
  min_joint_count: 20
training:
  balanced_sample_weight: true
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
acceptance:
  min_macro_f1_delta: 0.001
  max_fold_std_delta: 0.002
  max_simplification_macro_f1_drop: 0.001
  max_simplification_log_loss_increase: 0.01
  max_per_class_f1_drop: 0.05
notes: >-
  R1 pre-registered fold-local categorical summaries for C2-policy correlated
  pairs. Original v1 features are retained; only_left, only_right and both
  features are appended. Public LB and test are not used to select pairs.
