run_mode: experiment
record_role: official
experiment_id: EXP-621
issue_number: 621
slug: pairwise_redistribution_regularized
parent_experiment: EXP-374
component_experiments:
  - EXP-233
  - EXP-276
  - EXP-515
  - EXP-604
  - EXP-374
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
baseline:
  experiment_id: EXP-374
  oof_path: oof/exp374_stop_isoform_residue_mask.csv
  release_tag: exp-374-repro-v2
inner_cross_fitting:
  n_splits: 3
  seed_base: 5000
  note: >-
    Same mechanism as EXP-233/276/515: seed for outer fold i is
    seed_base + i, inner models trained only on that outer fold's train
    partition. Reuses EXP-374's own reconstructed feature pipeline (not
    frozen Feature Spec v1) as the inner-cross-fit proxy, same approach
    as EXP-515's build_exp374_train_matrix().
pairwise_redistribution:
  statistic_definition: >-
    EXP-515 found that apply_class_offset's softmax(z)*exp(o) followed by
    full 26-class row renormalization coupled all classes into a
    zero-sum competition, so restricting the *eligible* (searchable)
    classes to 4 did not protect the other 22 -- their absolute F1
    delta sum was 0.0994 against a 0.01 gate. This experiment replaces
    the mechanism itself: for each pair, the pair's own probability
    mass s = p_a + p_b is held fixed and only the internal split ratio
    r = p_a / s is shifted in logit space (r' = sigmoid(logit(r) +
    delta)); every other class's raw probability is left mathematically
    untouched (row sum is trivially conserved since only two entries
    that already summed to s are redistributed within that same sum).
  eligible_class_pairs:
    - [KIPAN, KIRC]
    - [GBMLGG, LGG]
  application_formula: "p_a' = s * sigmoid(logit(p_a/s) + delta); p_b' = s - p_a'; all other classes unchanged"
offset_search:
  candidate_grid_min: -1.0
  candidate_grid_max: 1.0
  candidate_grid_step: 0.1
  regularization_lambda: 0.02
  fit_scope: outer_fold_train_inner_cross_fit_only
  applied_to_outer_validation: transform_only
  applied_to_test: not_in_scope_this_experiment
  note: >-
    Each pair's delta is searched independently (single scalar grid
    search per pair, no coordinate descent needed) since the two pairs
    touch disjoint classes and do not interact through renormalization.
    regularization_lambda raised from EXP-604's 0.001 to 0.02 (grid kept
    at [-1.0, 1.0] so the search itself, not a hard grid cap, decides how
    far to move): EXP-604's found deltas clustered near the grid edge
    (-0.8 to -1.0), and a post-hoc scale sweep on EXP-604's actual OOF
    (scaling the found deltas down, not re-searching) showed a smooth
    tradeoff -- at 25% of the original delta magnitude, OOF Macro F1 gain
    was still +0.0016 (clears the +0.001 gate) while Log Loss regression
    dropped from +0.0169 to +0.0030 and non-eligible-class collateral
    dropped from 0.0223 to 0.0149. This value is fixed before running,
    not tuned against this run's own result.
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
official_selection:
  max_non_eligible_class_abs_f1_delta_sum: 0.015
  rule: >-
    Adopt if the single pairwise-redistribution run improves 26-class
    OOF Macro F1 over EXP-374 by >=+0.001 AND Log Loss does not regress
    AND fold-std does not regress AND the 22 non-eligible classes'
    summed absolute F1 delta is <=0.015. The 0.015 threshold (not 1e-6)
    is a corrected, evidence-based bar from EXP-604: EXP-604 proved that
    "raw probability values for other classes are unchanged" does NOT
    imply "those classes' classification outcomes are unchanged", since
    argmax is a 26-way competition and shifting two classes can still
    flip borderline predictions elsewhere -- so a near-zero collateral
    bar is not achievable by this mechanism at any delta that also moves
    Macro F1. 0.015 matches what EXP-604's own scale-sweep diagnostic
    measured at the delta magnitude expected under this experiment's
    stronger regularization. This rule is fixed here, before seeing the
    run's results.
notes: >-
  Issue #621, follow-up to #233/#276/#515/#604 (all rejected). EXP-604
  redesigned the redistribution mechanism to operate only within each
  target pair's own probability sub-budget (large improvement: 22-class
  collateral dropped from EXP-515's 0.0994 to 0.0223, and DLBC was fully
  unaffected for the first time) but the found deltas clustered near the
  [-1,1] grid edge, causing Log Loss (+0.0169) and fold-std (+0.0014) to
  regress and leaving non-eligible collateral well above a near-zero
  bar. This experiment keeps EXP-604's mechanism unchanged and only
  raises regularization_lambda (0.001 -> 0.02) so the search itself
  favors smaller, less extreme deltas -- not a post-hoc rescaling of
  EXP-604's already-found deltas, a fresh inner-cross-fit search under
  the new penalty.
optimism_bias_disclosure: >-
  Same as EXP-233/276/515: EXP-374 (baseline) selected each outer fold's
  checkpoint iteration by maximizing Macro F1 on that same fold's
  validation rows. This experiment's inner-fold early stopping reuses
  the inner holdout as eval_set, the same established pattern used
  throughout this project. Promotion beyond a Local diagnostic requires
  additional stability confirmation per PROJECT_CONTEXT.md's
  checkpoint-selection policy; this experiment does not claim that
  confirmation on its own.
