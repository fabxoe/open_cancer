run_mode: experiment
record_role: official
experiment_id: EXP-660
issue_number: 660
slug: minimal_track_a
parent_experiment: EXP-433
component_experiments: [EXP-479, EXP-497]
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
parser_baseline:
  representation: native_v3_semantic_range
features:
  mutation_type:
    enabled: true
    parser:
      name: stop_notation_invariant_v2
      definition_version: 2.1.0
      equivalent_stop_alternates: ["*", X, Ter]
  robust_aggregates: []
  drop_all_sample_aggregates: true
  residue_position:
    enabled: true
    aggregates: [max]
    missing_policy: zero
    complex_tokens: include
    transform: raw
    isoform_semantic_mask:
      enabled: true
      manifest_path: knowledge/ensembl_isoform_annotation_v1.json
      manifest_sha256: 568ea31f5b7fc7ff47d181fe552d39f3b9185f8d0a76cbb2a49d06be022d5bc0
      annotation_cache_path: data/external/ensembl_release_116/competition_gene_isoform_index.json
      annotation_cache_sha256: b9565339f1755d5b07e782c39064207310fa6c254b2e915a15492f4f38903daa
      trusted_categories: [CANONICAL_MATCH, MANE_MATCH, OTHER_ISOFORM_MATCH]
      masked_categories:
        - COMPLEX_OR_UNMAPPABLE
        - OUTSIDE_ALL_KNOWN_ISOFORMS
        - POSITION_VALID_REF_MISMATCH
hotspots:
  table: none
  evidence_scope: none
  minimum_matching_train_rows: 1
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: per-gene missing indicators only; all sample aggregates removed
  feature_types:
    - mutation_presence
    - parser_v4_native_v3_gene_consequence_presence
    - ensembl_release_116_isoform_eligible_max_residue_position
promotion_gate:
  comparison: EXP-433
  macro_f1_delta_min: 0.0
  log_loss_delta_max: 0.0
  fold_std_delta_max: 0.002
  per_class_f1_delta_min: -0.05
notes: >-
  Issue #660, first official experiment after the raw-first #658 audit. This
  minimal Track A representation preserves per-gene mutation presence and
  missingness, replaces historical lexical mutation types with parser-v4
  native v3 gene-level consequence presence, and adds only Ensembl release 116
  isoform-eligible max residue position. Every sample-level aggregate from the
  base matrix and native adapter is removed, including raw token multiplicity.
  No hotspot, pathway, class profile, test prevalence, adversarial propensity,
  Public LB, or Optuna result defines the schema or parameters.
comparison_metrics_path: reports/exp433_parser_v4_legacy_control/metrics.json

