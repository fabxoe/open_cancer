run_mode: experiment
record_role: official
experiment_id: EXP-604
issue_number: 604
slug: pairwise_probability_redistribution
parent_experiment: EXP-374
component_experiments:
  - EXP-233
  - EXP-276
  - EXP-515
  - EXP-374
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
baseline:
  experiment_id: EXP-374
  oof_path: oof/exp374_stop_isoform_residue_mask.csv
  release_tag: exp-374-repro-v2
inner_cross_fitting:
  n_splits: 3
  seed_base: 5000
  note: >-
    Same mechanism as EXP-233/276/515: seed for outer fold i is
    seed_base + i, inner models trained only on that outer fold's train
    partition. Reuses EXP-374's own reconstructed feature pipeline (not
    frozen Feature Spec v1) as the inner-cross-fit proxy, same approach
    as EXP-515's build_exp374_train_matrix().
pairwise_redistribution:
  statistic_definition: >-
    EXP-515 found that apply_class_offset's softmax(z)*exp(o) followed by
    full 26-class row renormalization coupled all classes into a
    zero-sum competition, so restricting the *eligible* (searchable)
    classes to 4 did not protect the other 22 -- their absolute F1
    delta sum was 0.0994 against a 0.01 gate. This experiment replaces
    the mechanism itself: for each pair, the pair's own probability
    mass s = p_a + p_b is held fixed and only the internal split ratio
    r = p_a / s is shifted in logit space (r' = sigmoid(logit(r) +
    delta)); every other class's raw probability is left mathematically
    untouched (row sum is trivially conserved since only two entries
    that already summed to s are redistributed within that same sum).
  eligible_class_pairs:
    - [KIPAN, KIRC]
    - [GBMLGG, LGG]
  application_formula: "p_a' = s * sigmoid(logit(p_a/s) + delta); p_b' = s - p_a'; all other classes unchanged"
offset_search:
  candidate_grid_min: -1.0
  candidate_grid_max: 1.0
  candidate_grid_step: 0.1
  regularization_lambda: 0.001
  fit_scope: outer_fold_train_inner_cross_fit_only
  applied_to_outer_validation: transform_only
  applied_to_test: not_in_scope_this_experiment
  note: >-
    Each pair's delta is searched independently (single scalar grid
    search per pair, no coordinate descent needed) since the two pairs
    touch disjoint classes and do not interact through renormalization.
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
official_selection:
  max_non_eligible_class_abs_f1_delta_sum: 1.0e-6
  rule: >-
    Adopt if the single pairwise-redistribution run improves 26-class
    OOF Macro F1 over EXP-374 AND Log Loss does not regress AND
    fold-std does not regress AND the 22 non-eligible classes' summed
    absolute F1 delta is (as designed) approximately zero -- this is a
    structural guarantee of the transform, not just an empirical
    target, so the run must additionally verify this numerically
    (expected to be exactly 0.0 modulo floating point, since those
    classes' raw probabilities are never modified). This rule is fixed
    here, before seeing the run's results.
notes: >-
  Issue #604, follow-up to #233/#276/#515 (all rejected: post-hoc offset
  mechanisms based on softmax(z)*exp(o) + full row renormalization
  disturb classes outside the intended eligible set because the
  renormalization couples all 26 classes' probability mass). This
  experiment redesigns the redistribution mechanism itself to operate
  only within each target pair's own probability sub-budget, so classes
  outside the two pairs are mathematically guaranteed to be unaffected
  rather than merely intended to be unaffected.
optimism_bias_disclosure: >-
  Same as EXP-233/276/515: EXP-374 (baseline) selected each outer fold's
  checkpoint iteration by maximizing Macro F1 on that same fold's
  validation rows. This experiment's inner-fold early stopping reuses
  the inner holdout as eval_set, the same established pattern used
  throughout this project. Promotion beyond a Local diagnostic requires
  additional stability confirmation per PROJECT_CONTEXT.md's
  checkpoint-selection policy; this experiment does not claim that
  confirmation on its own.
