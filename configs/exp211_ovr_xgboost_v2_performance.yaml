run_mode: experiment
record_role: official
experiment_id: EXP-211
issue_number: 211
slug: ovr_xgboost_v2_performance
parent_experiment: EXP-096
seed: 42
feature_spec:
  name: v2-performance
  frozen_manifest: configs/abc_stack_feature_spec_v2.yaml
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
model:
  name: ovr_xgboost
  parameters:
    binary_balanced_sample_weight: true
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1.0
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.0
    reg_lambda: 1.0
    eval_metric: logloss
    early_stopping_rounds: 30
    tree_method: hist
    device: cpu
    n_jobs: 8
    verbosity: 0
training:
  balanced_sample_weight: false
  binary_balanced_sample_weight: true
notes: >-
  Issue #211. Frozen Feature Spec v2-performance, canonical folds, and the
  EXP-096 tree parameters are held fixed. The sole model change is from one
  multiclass XGBoost model to 26 one-vs-rest binary XGBoost models per fold.
  Each binary class weight is fit only on the corresponding outer-fold train.
