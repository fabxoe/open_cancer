run_mode: experiment
record_role: official
experiment_id: EXP-327
issue_number: 327
slug: isoform_relative_position_bin
parent_experiment: EXP-229
component_experiments: [EXP-094, EXP-096, EXP-219, EXP-223, EXP-229]
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mutation_type:
    enabled: true
  robust_aggregates:
    - sample__mutated_gene_count_log1p
    - sample__total_variant_count_log1p
    - sample__multi_variant_gene_count_log1p
  residue_position:
    enabled: true
    aggregates: [max]
    missing_policy: indicator
    complex_tokens: include
    transform: raw
    isoform_relative_bin:
      enabled: true
      bin_count: 5
      manifest_path: knowledge/ensembl_isoform_relative_bin_v1.json
      manifest_sha256: be00d218b0791a4cc76ab008e243e0bc1ad1eba6f4734be8c337bfa6d05543bf
      annotation_cache_path: data/external/ensembl_release_116/competition_gene_isoform_index.json
      annotation_cache_sha256: b9565339f1755d5b07e782c39064207310fa6c254b2e915a15492f4f38903daa
hotspots:
  table: extended_34
  evidence_scope: additions_15
  minimum_matching_train_rows: 5
external_knowledge:
  file: knowledge/canonical_pathways_sanchez_vega_v1.json
  organizer_approval_reference: https://github.com/fabxoe/open_cancer/issues/96#issuecomment-5151028180
  source_commit: 7d29965de6ac8d0c6ec18c383f6dff8a48d562e7
  source_sha256: a625675d03fa314eb27f3ab731524de13621a35aecd8edb7c67878f2d89ae07a
abc_families:
  fixed_pathway_burden:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    groups: 10
    values: [mutated_gene_count, lof_gene_count]
    output_dimension: 20
  pathway_mutation_type_composition:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    groups: 10
    values:
      - missense_gene_count
      - synonymous_gene_count
      - nonsense_gene_count
      - frameshift_gene_count
      - complex_gene_count
    candidate_output_dimension: 50
    semantic_equivalence_filter: fold_train_against_feature_spec_v1
  functional_role_burden:
    enabled: false
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - feature_spec_v1
    - fixed_pathway_mutated_and_lof_gene_counts
    - fixed_pathway_mutation_type_gene_counts
    - ensembl_release_116_isoform_relative_position_bin
notes: >-
  Issue #327. EXP-229 model, pathway families, canonical folds, seed and
  Macro-F1 checkpoint policy are fixed. The sole change replaces raw gene-level
  max residue position with a deterministic Ensembl 116 relative 5-bin value
  plus observed indicator. No target, test distribution or Public LB defines
  the transform.
comparison_metrics_path: reports/exp229_pathway_mutation_types/metrics.json
