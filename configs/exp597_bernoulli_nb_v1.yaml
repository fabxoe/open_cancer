run_mode: experiment
record_role: official
slug: bernoulli_nb_v1
parent_experiment: EXP-094
seed: 42
feature_spec:
  name: v1
  frozen_manifest: configs/abc_stack_feature_spec_v2.yaml
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
model:
  name: bernoulli_naive_bayes
  parameters:
    alpha: 1.0
training:
  balanced_sample_weight: true
notes: >-
  Frozen Feature Spec v1 and canonical folds are held fixed while the model
  family changes from every discriminative v1 adapter (boosting, linear) to
  a generative BernoulliNB. sklearn's BernoulliNB has no random_state (fully
  deterministic given fixed inputs). Purpose is a new diversity candidate for
  the #505 SAINT/TF-IDF stacking roadmap's S0 audit, not a standalone
  leaderboard candidate.
