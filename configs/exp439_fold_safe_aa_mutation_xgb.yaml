experiment_id: EXP-439
issue_number: 439
run_mode: experiment
record_role: official
slug: fold_safe_aa_mutation_xgb
parent_experiment: EXP-374
owner: Gomin-art
seed: 42

data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv
  sample_submission_path: data/raw/sample_submission.csv
  canonical_split_path: data/splits/stratified_5fold_seed42.csv
  id_column: ID
  target_column: SUBCLASS
  fold_column: fold

features:
  top_n_genes: 1500
  minimum_fold_train_support: 2
  mutation_presence: true
  amino_acid_mutation_matrix: true
  amino_acids: ACDEFGHIKLMNPQRSTVWY
  mutation_groups: [FS, S, ST, M, MT]
  stop_notation_normalization: true
  multi_token_policy: MT
  complex_or_unparsed_policy: MT
  blank_policy: no_mutation_with_missing_count
  row_summary_features: true

imbalance:
  strategy: balanced_sample_weight
  smoteenn: false

search:
  enabled: true
  n_trials: 3
  inner_splits: 2
  sampler: tpe
  primary_metric: macro_f1
  n_estimators_ceiling: 800
  early_stopping_rounds: 40

model:
  objective: multi:softprob
  eval_metric: mlogloss
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
  parameter_space:
    learning_rate: [0.02, 0.08]
    max_depth: [3, 7]
    min_child_weight: [1.0, 10.0]
    subsample: [0.60, 0.95]
    colsample_bytree: [0.50, 0.90]
    reg_alpha: [0.0001, 2.0]
    reg_lambda: [0.5, 10.0]
    gamma: [0.0, 0.5]

outputs:
  artifact_slug: exp439_fold_safe_aa_mutation_xgb

notes:
  - The canonical outer validation fold is never used for feature selection or Optuna search.
  - Test rows are transformed only and are never used for fitting, feature selection, or tuning.
  - SMOTEENN is intentionally disabled because interpolation is not biologically meaningful for sparse mutation indicators and count features.
  - Balanced sample weights are calculated independently from each training partition.
