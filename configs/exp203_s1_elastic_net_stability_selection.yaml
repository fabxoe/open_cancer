run_mode: experiment
record_role: official
experiment_id: EXP-203
issue_number: 203
slug: exp203_s1_elastic_net_stability_selection
parent_experiment: EXP-094
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
baseline:
  feature_spec: v1
  metrics_path: reports/exp094_feature_spec_v1/metrics.json
feature_selection:
  method: elastic_net_stability_selection
  scope: outer_fold_train_only
  c_values: [0.01, 0.03, 0.1, 0.3, 1.0]
  l1_ratio: 0.5
  inner_splits: 3
  subsample_fraction: 0.75
  repetitions: 20
  min_frequency: 16
  min_genes: 50
  max_genes: 512
  max_iter: 500
  n_jobs: 8
training:
  balanced_sample_weight: true
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
acceptance:
  min_macro_f1_delta: 0.001
  max_fold_std_delta: 0.002
  max_simplification_macro_f1_drop: 0.001
  max_simplification_log_loss_increase: 0.01
  max_per_class_f1_drop: 0.05
notes: >-
  S1 pre-registered Elastic Net stability selection. Inner CV, subsampling,
  and selection use only each outer fold's training rows. Validation and test
  reuse the saved mask; Public LB and test are never used to choose genes.
