run_mode: experiment
record_role: official
experiment_id: EXP-438
issue_number: 438
slug: parser_v4_native_semantic_baseline
parent_experiment: EXP-433
component_experiments:
  - EXP-435
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
parser_baseline:
  representation: native
features:
  mutation_type:
    enabled: true
  robust_aggregates: []
  residue_position:
    enabled: false
hotspots:
  table: none
  evidence_scope: none
  minimum_matching_train_rows: 1
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - mutation_presence
    - parser_v4_native_semantic
    - parser_v4_parse_status_summary
    - parser_v4_frameshift_grammar_summary
notes: >-
  N4 Native N. The historical five-family columns are replaced by the frozen
  parser-v4 native semantic schema while mutation presence and missingness are
  preserved. All non-parser feature families are excluded.
