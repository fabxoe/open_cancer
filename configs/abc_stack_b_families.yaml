# Defaults inherited by future B-family Experiment configs; not an experiment.
base_feature_spec:
  experiment_id: EXP-094
  # Re-pinned 2026-08-06 (#596/#597); see frozen_feature_specs.py
  sha256: 8f564cc18b3bcef8c59879144f19ff0d62ac3d5ee13ea6887ce59d265d8f843a

families:
  complex_morphology:
    enabled: false
    definition_version: 1.0.0
    fit_scope: stateless
    output_dimension: 8
    denominator: total_mutation_tokens_or_one
    complex_classes:
      - multi_position_complex
      - inframe_or_delins
      - other_complex
  frequency_tier_spectrum:
    enabled: false
    definition_version: 1.0.0
    fit_scope: fold_train
    tier_count: 4
    tier_rule: mutation_presence_rank_then_gene_lexical
    mutation_types: [missense, synonymous, nonsense, frameshift, complex]
    values: [count, fraction_of_sample_total_tokens]
    output_dimension: 40

evaluation:
  split: data/splits/stratified_5fold_seed42.csv
  class_order: open_cancer.constants.CLASS_LABELS
  required_outputs: [oof_probability, test_probability, resolved_config, metrics, artifact_manifest]
