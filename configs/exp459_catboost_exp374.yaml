execution_target: local_cpu_m1_pro
notes: >-
  Issue #459. Model diversity arm parallel to EXP-449 (LightGBM) and #457
  (stacking), built on top of EXP-374 (currently valid legacy parent while
  N5/parser-native baseline reset is still in progress per roadmap #422).
  Feature set is EXP-374's build_fold_features() reused unchanged (parser
  v2.1.0 stop-notation-invariant + Ensembl isoform mask + pathway families +
  hotspot-34). Only the model changes, from XGBoost to CatBoost. Starting
  hyperparameters are EXP-127's GPU CatBoost config (iterations=1000, depth=8,
  learning_rate=0.05, l2_leaf_reg=3, border_count=32, bootstrap_type=Bernoulli,
  subsample=0.8), reduced to a CPU-feasible depth=6/iterations=400/rsm=0.1
  based on the preflight timing above -- this is a compute-bounded config, not
  a retuned one, so results are not a like-for-like comparison against
  EXP-127's GPU run. No Optuna, no retuning beyond the compute-forced
  reduction. Target, test distribution and Public LB do not define any
  parameter here.
