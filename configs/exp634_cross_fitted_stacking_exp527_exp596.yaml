notes: >-
  Issue #634. #505 Cross-fitted Stacking 로드맵의 S2 단계. base는 EXP-527
  (XGBoost)과 EXP-596(RandomForest, #505가 정의한 "오류 다양성이 검증된"
  후보) OOF/test 확률만 사용하고 재학습하지 않는다. 메타모델은 #505가 정한
  L2 Multinomial Logistic Regression(강하게 규제, C=0.2)이며
  `configs/exp137_cross_fitted_stacking.yaml`과 동일한 기본값을 그대로
  재사용했다. 비교 기준은 EXP-628(nested-selected 0.35/0.65 고정 블렌드,
  현재 Local 최고).
