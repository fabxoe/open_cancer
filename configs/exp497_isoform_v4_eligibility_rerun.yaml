run_mode: experiment
record_role: official
experiment_id: EXP-497
issue_number: 497
slug: isoform_v4_eligibility_rerun
parent_experiment: EXP-374
component_experiments: [EXP-229, EXP-313, EXP-369, EXP-374]
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mutation_type:
    enabled: true
    parser:
      name: stop_notation_invariant_v2
      definition_version: 2.1.0
      equivalent_stop_alternates: ["*", X, Ter]
      other_v1_semantics_preserved: true
  robust_aggregates:
    - sample__mutated_gene_count_log1p
    - sample__total_variant_count_log1p
    - sample__multi_variant_gene_count_log1p
  residue_position:
    enabled: true
    aggregates: [max]
    missing_policy: zero
    complex_tokens: include
    transform: raw
    isoform_semantic_mask:
      enabled: true
      manifest_path: knowledge/ensembl_isoform_annotation_v1.json
      manifest_sha256: 568ea31f5b7fc7ff47d181fe552d39f3b9185f8d0a76cbb2a49d06be022d5bc0
      annotation_cache_path: data/external/ensembl_release_116/competition_gene_isoform_index.json
      annotation_cache_sha256: b9565339f1755d5b07e782c39064207310fa6c254b2e915a15492f4f38903daa
      trusted_categories:
        - CANONICAL_MATCH
        - MANE_MATCH
        - OTHER_ISOFORM_MATCH
      masked_categories:
        - COMPLEX_OR_UNMAPPABLE
        - OUTSIDE_ALL_KNOWN_ISOFORMS
        - POSITION_VALID_REF_MISMATCH
hotspots:
  table: extended_34
  evidence_scope: additions_15
  minimum_matching_train_rows: 5
  stop_notation_normalization: true
external_knowledge:
  file: knowledge/canonical_pathways_sanchez_vega_v1.json
  organizer_approval_reference: https://github.com/fabxoe/open_cancer/issues/96#issuecomment-5151028180
  source_commit: 7d29965de6ac8d0c6ec18c383f6dff8a48d562e7
  source_sha256: a625675d03fa314eb27f3ab731524de13621a35aecd8edb7c67878f2d89ae07a
abc_families:
  fixed_pathway_burden:
    enabled: true
    definition_version: 2.1.0
    fit_scope: stateless
    groups: 10
    values: [mutated_gene_count, lof_gene_count]
    stop_notation_normalization: true
    output_dimension: 20
  pathway_mutation_type_composition:
    enabled: true
    definition_version: 2.1.0
    fit_scope: stateless
    groups: 10
    values:
      - missense_gene_count
      - synonymous_gene_count
      - nonsense_gene_count
      - frameshift_gene_count
      - complex_gene_count
    stop_notation_normalization: true
    candidate_output_dimension: 50
    semantic_equivalence_filter: fold_train_against_feature_spec_v1
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - exp369_feature_spec_with_stop_notation_invariant_parser
    - ensembl_release_116_residue_position_mask
notes: >-
  Issue #497 (N6 follow-up, roadmap #422 §12). EXP-374 model, folds, seed,
  checkpoint policy, stop notation parser, pathways and hotspots are byte-
  identical to EXP-374. The sole change is upstream: Issue #493/PR #495
  replaced the legacy isoform substitution eligibility regex
  (mutation_features._SUBSTITUTION) with parser v4 routing
  (mutation_parser_contract.route_protein_mutation) inside
  isoform_semantics.py/isoform_relative_position.py, which
  isoform_position_mask.py (consumed here via residue_position.
  isoform_semantic_mask) picks up with no config change. A target-independent
  audit found the legacy regex silently misclassified 10,397 (gene, token)
  pairs (2.14%) as "complex" because it never accepted X as a substitution
  alternate (e.g. R507X), hiding them from isoform position matching; 336
  pairs (0.07%) moved the other way (M1 start-codon substitutions legacy
  wrongly matched, v4 correctly excludes). This run measures the resulting
  OOF delta with no new feature engineering and no Optuna. Requires PR #495
  merged into main before the canonical run (prepared ahead of merge in an
  isolated worktree/cherry-pick per team lead's active main batch-merge).
comparison_metrics_path: reports/exp374_stop_isoform_residue_mask/metrics.json
