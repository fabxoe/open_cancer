run_mode: experiment
record_role: official
experiment_id: EXP-656
issue_number: 656
slug: mmr_gene_proxy_exp374
parent_experiment: EXP-374
component_experiments: [EXP-653]
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mutation_type:
    enabled: true
    parser:
      name: stop_notation_invariant_v2
      definition_version: 2.1.0
      equivalent_stop_alternates: ["*", X, Ter]
      other_v1_semantics_preserved: true
  robust_aggregates:
    - sample__mutated_gene_count_log1p
    - sample__total_variant_count_log1p
    - sample__multi_variant_gene_count_log1p
  residue_position:
    enabled: true
    aggregates: [max]
    missing_policy: zero
    complex_tokens: include
    transform: raw
    isoform_semantic_mask:
      enabled: true
      manifest_path: knowledge/ensembl_isoform_annotation_v1.json
      manifest_sha256: 568ea31f5b7fc7ff47d181fe552d39f3b9185f8d0a76cbb2a49d06be022d5bc0
      annotation_cache_path: data/external/ensembl_release_116/competition_gene_isoform_index.json
      annotation_cache_sha256: b9565339f1755d5b07e782c39064207310fa6c254b2e915a15492f4f38903daa
      trusted_categories:
        - CANONICAL_MATCH
        - MANE_MATCH
        - OTHER_ISOFORM_MATCH
      masked_categories:
        - COMPLEX_OR_UNMAPPABLE
        - OUTSIDE_ALL_KNOWN_ISOFORMS
        - POSITION_VALID_REF_MISMATCH
hotspots:
  table: extended_34
  evidence_scope: additions_15
  minimum_matching_train_rows: 5
  stop_notation_normalization: true
external_knowledge:
  file: knowledge/canonical_pathways_sanchez_vega_v1.json
  organizer_approval_reference: https://github.com/fabxoe/open_cancer/issues/96#issuecomment-5151028180
  source_commit: 7d29965de6ac8d0c6ec18c383f6dff8a48d562e7
  source_sha256: a625675d03fa314eb27f3ab731524de13621a35aecd8edb7c67878f2d89ae07a
abc_families:
  fixed_pathway_burden:
    enabled: true
    definition_version: 2.1.0
    fit_scope: stateless
    groups: 10
    values: [mutated_gene_count, lof_gene_count]
    stop_notation_normalization: true
    output_dimension: 20
  pathway_mutation_type_composition:
    enabled: true
    definition_version: 2.1.0
    fit_scope: stateless
    groups: 10
    values:
      - missense_gene_count
      - synonymous_gene_count
      - nonsense_gene_count
      - frameshift_gene_count
      - complex_gene_count
    stop_notation_normalization: true
    candidate_output_dimension: 50
    semantic_equivalence_filter: fold_train_against_feature_spec_v1
  observable_marker_proxies:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    knowledge_file: knowledge/mmr_gene_proxy_v1.json
    panels: 1
    panel_genes_catalog: [MLH1, MSH2, MSH6, PMS2]
    panel_genes_in_panel: [MLH1, MSH2, PMS2]
    output_dimension: 4
    reused_from: EXP-302/EXP-653 (src/open_cancer/observable_marker_features.py, unchanged; isolated single-panel knowledge file)
    semantic_equivalence_filter: fold_train_against_base_feature_spec_v1
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - exp369_feature_spec_with_stop_notation_invariant_parser
    - ensembl_release_116_residue_position_mask
    - fixed_observable_cancer_marker_proxies_mmr_only
acceptance:
  comparison_experiment: EXP-374
  minimum_macro_f1_delta: 0.001
  maximum_fold_std_increase: 0.002
  require_no_clear_log_loss_regression: true
  maximum_single_class_f1_regression: 0.05
notes: >-
  Issue #656. EXP-374 is frozen (same model, folds, seed, checkpoint policy,
  stop notation parser, pathways, hotspots, and Ensembl residue-position mask
  as EXP-374 itself). The only change is the isolated MMR-gene (MLH1, MSH2,
  MSH6, PMS2) observable marker proxy from EXP-653, reusing the unchanged
  ObservableMarkerFamily implementation with knowledge/mmr_gene_proxy_v1.json.
  EXP-653 tested the identical panel on the EXP-527 (class-cosine native)
  parent and passed the aggregate Macro F1 gate but collapsed LGG (-0.1304)
  and KIRC (-0.1071) well past the -0.05 threshold, ARCHIVE. This experiment
  checks whether the same panel is stable on the legacy EXP-374 parent, which
  has a much lower Local-Public shift_gap and has shown no KIPAN/KIRC or
  GBMLGG/LGG collapse in prior direct interventions on that axis (EXP-514,
  EXP-515, EXP-604). Target, test distribution and Public LB are not used to
  define the panel.
comparison_metrics_path: reports/exp374_stop_isoform_residue_mask/metrics.json
