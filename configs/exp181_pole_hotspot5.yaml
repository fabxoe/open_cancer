run_mode: experiment
record_role: official
experiment_id: EXP-181
issue_number: 181
parent_experiment: EXP-094
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
baseline:
  feature_spec: v1
  metrics_path: reports/exp094_feature_spec_v1/metrics.json
variants:
  - name: pole_hotspot5
    added_features: [pole__hotspot5]
    gene: POLE
    hotspot_count: 5
    feature_family: src/open_cancer/pole_ed_features.py::pole_hotspot5_family
    # No downloadable source file: this table is a hardcoded, cited literal
    # (domain consultation + literature), matching hotspot_features.py's
    # EXTENDED_HOTSPOTS convention, not a KnowledgeProvenance-file-backed
    # source like the Cell Cycle pathway family (Issue #167/#170).
    domain_basis: Vera Health consultation (2026-08-02) + POLE ED hotspot literature (TCGA, ESMO endometrial guidelines)
watch_classes:
  - UCEC
  - COAD
stability:
  train_positive_count: 22
  fold_positive_counts: {0: 8, 1: 5, 2: 5, 3: 1, 4: 3}
  note: "fold 3 has only 1 positive sample -- multi-seed check required"
  model_seeds: [1001, 1002, 1003]
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
acceptance:
  min_macro_f1_delta: 0.001
  max_fold_std_delta: 0.002
  require_no_log_loss_regression: true
  require_no_per_class_f1_regression: true
