run_mode: experiment
record_role: official
experiment_id: EXP-514
issue_number: 514
slug: kidney_glioma_lineage_burden
parent_experiment: EXP-374
component_experiments: [EXP-374]
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mutation_type:
    enabled: true
    parser:
      name: stop_notation_invariant_v2
      definition_version: 2.1.0
      equivalent_stop_alternates: ["*", X, Ter]
      other_v1_semantics_preserved: true
  robust_aggregates:
    - sample__mutated_gene_count_log1p
    - sample__total_variant_count_log1p
    - sample__multi_variant_gene_count_log1p
  residue_position:
    enabled: true
    aggregates: [max]
    missing_policy: zero
    complex_tokens: include
    transform: raw
    isoform_semantic_mask:
      enabled: true
      manifest_path: knowledge/ensembl_isoform_annotation_v1.json
      manifest_sha256: 568ea31f5b7fc7ff47d181fe552d39f3b9185f8d0a76cbb2a49d06be022d5bc0
      annotation_cache_path: data/external/ensembl_release_116/competition_gene_isoform_index.json
      annotation_cache_sha256: b9565339f1755d5b07e782c39064207310fa6c254b2e915a15492f4f38903daa
      trusted_categories:
        - CANONICAL_MATCH
        - MANE_MATCH
        - OTHER_ISOFORM_MATCH
      masked_categories:
        - COMPLEX_OR_UNMAPPABLE
        - OUTSIDE_ALL_KNOWN_ISOFORMS
        - POSITION_VALID_REF_MISMATCH
hotspots:
  table: extended_34
  evidence_scope: additions_15
  minimum_matching_train_rows: 5
  stop_notation_normalization: true
external_knowledge:
  - group: canonical_pathways
    file: knowledge/canonical_pathways_sanchez_vega_v1.json
    organizer_approval_reference: https://github.com/fabxoe/open_cancer/issues/96#issuecomment-5151028180
    source_commit: 7d29965de6ac8d0c6ec18c383f6dff8a48d562e7
    source_sha256: a625675d03fa314eb27f3ab731524de13621a35aecd8edb7c67878f2d89ae07a
  - group: kirc_kidney_glioma_lineage
    file: knowledge/kirc_kidney_glioma_lineage_v1.json
    organizer_approval_reference: https://github.com/fabxoe/open_cancer/issues/96#issuecomment-5151028180
    source_commit: null
    source_sha256: null
    notes: >-
      Hand-curated literature gene panel (no single downloadable source
      file/commit to cite), covered by the same organizer-approved fixed
      external gene-group-membership pattern as canonical_pathways above.
abc_families:
  fixed_pathway_burden:
    enabled: true
    definition_version: 2.1.0
    fit_scope: stateless
    groups: 10
    values: [mutated_gene_count, lof_gene_count]
    stop_notation_normalization: true
    output_dimension: 20
  pathway_mutation_type_composition:
    enabled: true
    definition_version: 2.1.0
    fit_scope: stateless
    groups: 10
    values:
      - missense_gene_count
      - synonymous_gene_count
      - nonsense_gene_count
      - frameshift_gene_count
      - complex_gene_count
    stop_notation_normalization: true
    candidate_output_dimension: 50
    semantic_equivalence_filter: fold_train_against_feature_spec_v1
  kirc_kidney_glioma_lineage_burden:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    knowledge_file: knowledge/kirc_kidney_glioma_lineage_v1.json
    groups: 2
    values: [mutated_gene_count, lof_gene_count]
    stop_notation_normalization: true
    output_dimension: 4
    semantic_equivalence_filter: fold_train_against_feature_spec_v1
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - exp369_feature_spec_with_stop_notation_invariant_parser
    - ensembl_release_116_residue_position_mask
    - fixed_pathway_mutated_and_lof_gene_counts
    - fixed_pathway_mutation_type_gene_counts
    - kirc_kidney_glioma_lineage_mutated_and_lof_gene_counts
notes: >-
  Issue #514. EXP-374 model, folds, seed, checkpoint policy, stop notation
  parser, Ensembl residue-position mask, canonical pathway-20 burden and
  pathway mutation-type composition are all held fixed and unchanged. The
  sole change adds four new sample-level burden columns (mutated_gene_count,
  lof_gene_count for each of two fixed lineage gene groups) from a new,
  independently literature-curated knowledge/kirc_kidney_glioma_lineage_v1.json
  panel: a kidney/VHL-mTOR lineage group (VHL, MTOR, TSC1, TSC2, PTEN, MET, FH)
  and a glioma/WHO-IDH lineage group (IDH1, IDH2, ATRX, TP53, NF1, PTEN, EGFR).
  Hypothesis: EXP-374 OOF error analysis found the two largest confusion pairs
  are KIPAN<->KIRC (390 combined misclassifications) and GBMLGG<->LGG (288
  combined); these lineage-driver burden columns might help the tree model
  separate them better than individual gene splits across the 4,384-column
  mutation-presence matrix. Target, test distribution, and Public LB do not
  define or select the gene groups. Single-family ablation against EXP-374.
comparison_metrics_path: reports/exp374_stop_isoform_residue_mask/metrics.json
