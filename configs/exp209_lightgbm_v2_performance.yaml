run_mode: experiment
record_role: official
experiment_id: EXP-209
issue_number: 209
slug: lightgbm_v2_performance
parent_experiment: EXP-125
seed: 42
feature_spec:
  name: v2-performance
  frozen_manifest: configs/abc_stack_feature_spec_v2.yaml
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
model:
  name: lightgbm
  parameters:
    n_estimators: 1200
    learning_rate: 0.03
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_alpha: 0.0
    reg_lambda: 1.0
    early_stopping_rounds: 60
    n_jobs: 8
    verbosity: -1
    deterministic: true
    force_col_wise: true
training:
  balanced_sample_weight: true
notes: >-
  Issue #209. EXP-125 LightGBM settings and canonical folds are held fixed
  while frozen Feature Spec v1 is replaced by v2-performance, which adds only
  the fixed pathway burden family validated by EXP-096.
