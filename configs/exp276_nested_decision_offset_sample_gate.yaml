run_mode: experiment
record_role: official
experiment_id: EXP-276
issue_number: 276
slug: nested_decision_offset_sample_gate
parent_experiment: EXP-219
component_experiments:
  - EXP-094
  - EXP-219
  - EXP-233
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
baseline:
  experiment_id: EXP-219
  oof_path: oof/exp219_macro_f1_checkpoint_selection.csv
  release_tag: exp-219-repro-v1
  release_bundle_sha256: fa293ed92a21508e0752890ca407c6e55cbc879468
inner_cross_fitting:
  n_splits: 3
  seed_base: 5000
  note: >-
    Identical to EXP-233: seed for outer fold i is seed_base + i, inner
    models trained only on that outer fold's train partition (never its own
    validation rows), same Feature Spec v1 matrix and XGBoost
    hyperparameters as EXP-219's model block. Training runs exactly once;
    the 3 sample-gate thresholds below only change which classes the
    already-computed inner-cross-fit probabilities are allowed to search an
    offset for (cheap, no retraining per threshold).
sample_gate:
  statistic: min_class_count_per_inner_fold
  statistic_definition: >-
    For each class, the minimum count of that class across the n_splits
    inner-fold holdouts within one outer fold's train partition (computed
    by open_cancer.nested_decision_offset.min_class_count_per_inner_fold).
    NOT the raw outer-train count -- Issue #233 found DLBC's outer-train
    count (30-31) is already close to other small classes (ACC: 57) and
    would not be excluded by any threshold in the range below; the
    per-inner-fold minimum (DLBC: 10.0, ACC: 19.0) is the quantity that
    actually determines offset-search stability and is what these
    thresholds are calibrated against.
  threshold_candidates:
    - 15
    - 20
    - 25
  below_threshold_action: offset_fixed_at_zero
offset_search:
  candidate_grid_min: -1.0
  candidate_grid_max: 1.0
  candidate_grid_step: 0.1
  regularization_lambda: 0.001
  max_coordinate_passes: 5
  application: multiplicative_renormalized
  application_formula: "softmax(z + o) ∝ softmax(z) * exp(o), renormalized"
  fit_scope: outer_fold_train_inner_cross_fit_only
  applied_to_outer_validation: transform_only
  applied_to_test: not_in_scope_this_experiment
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
official_threshold_selection:
  rule: >-
    Among the 3 threshold candidates, the official (record_role: official)
    result is the smallest threshold whose 26-class OOF Macro F1 improves
    over EXP-219 AND whose Log Loss and fold-std do not regress versus
    EXP-219. If none qualifies, the experiment is ARCHIVEd like EXP-233 and
    no threshold is preferred over another. This rule is fixed here, before
    seeing any threshold's results.
notes: >-
  Issue #276, follow-up to #233 (rejected: 26-class OOF Macro F1 improved
  +0.0019573460 but DLBC F1 collapsed -0.1235 and 2/5 outer folds declined).
  #233 additionally found that excluding DLBC from the Macro F1 computation
  made all 5 outer folds improve consistently (+0.0069751072, ~3.5x the
  26-class delta), suggesting the failure is localized to DLBC (and
  possibly similarly tiny classes) rather than the offset method itself.
  This experiment adds a per-class sample gate to the same inner
  cross-fitting design: classes below the gate keep offset=0 (their
  original EXP-219 probabilities, untouched) instead of having their
  coordinate searched.
optimism_bias_disclosure: >-
  Same as EXP-233: EXP-219 (baseline) selected each outer fold's checkpoint
  iteration by maximizing Macro F1 on that same fold's validation rows.
  This experiment's inner-fold early stopping reuses the inner holdout as
  eval_set, the same established pattern used throughout this project for
  outer-fold OOF generation. Current best / final-candidate promotion of
  any macro-F1-checkpoint-selected model requires additional stability
  confirmation (repeated seeds, independent retraining, or Public LB) per
  PROJECT_CONTEXT.md's checkpoint-selection policy; this experiment does
  not claim that confirmation on its own.
