run_mode: experiment
record_role: official
experiment_id: EXP-355
issue_number: 355
slug: robust_complex_gene_count
parent_experiment: EXP-229
component_experiments:
  - EXP-094
  - EXP-096
  - EXP-219
  - EXP-223
  - EXP-229
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mutation_type:
    enabled: true
  robust_aggregates:
    - sample__mutated_gene_count_log1p
    - sample__total_variant_count_log1p
    - sample__multi_variant_gene_count_log1p
  residue_position:
    enabled: true
    aggregates:
      - max
    missing_policy: zero
    complex_tokens: include
    transform: raw
  annotation_invariant_parser:
    enabled: true
    definition_version: 2.0.0
    replacement:
      drop: sample__complex_count
      add: sample__robust_non_simple_event_gene_count
    non_simple_event_families:
      - inframe_deletion
      - inframe_insertion
      - delins
      - range_replacement
      - duplication
      - other_unmappable
hotspots:
  table: extended_34
  evidence_scope: additions_15
  minimum_matching_train_rows: 5
external_knowledge:
  file: knowledge/canonical_pathways_sanchez_vega_v1.json
  organizer_approval_reference: https://github.com/fabxoe/open_cancer/issues/96#issuecomment-5151028180
  source_commit: 7d29965de6ac8d0c6ec18c383f6dff8a48d562e7
  source_sha256: a625675d03fa314eb27f3ab731524de13621a35aecd8edb7c67878f2d89ae07a
abc_families:
  fixed_pathway_burden:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    groups: 10
    values:
      - mutated_gene_count
      - lof_gene_count
    output_dimension: 20
  pathway_mutation_type_composition:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    groups: 10
    values:
      - missense_gene_count
      - synonymous_gene_count
      - nonsense_gene_count
      - frameshift_gene_count
      - complex_gene_count
    candidate_output_dimension: 50
    semantic_equivalence_filter: fold_train_against_feature_spec_v1
  robust_non_simple_event_gene_count:
    enabled: true
    definition_version: 2.0.0
    fit_scope: stateless
    output_dimension: 1
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - feature_spec_v1
    - fixed_pathway_mutated_and_lof_gene_counts
    - fixed_pathway_mutation_type_gene_counts
    - robust_non_simple_event_gene_count_replacing_raw_complex_count
notes: >-
  Issue #355. EXP-229 features, model, balanced sample weight, validation
  Macro-F1 checkpoint selection, seed, and canonical folds are held fixed. The
  sole change is replacing raw sample__complex_count with the unique number of
  genes containing a normalized non-simple protein event. X alternate stop
  notation is normalized to stop_gain and is not counted as complex. Target,
  test prevalence, and Public LB do not define parser families or thresholds.
comparison_metrics_path: reports/exp229_pathway_mutation_types/metrics.json
