run_mode: experiment
record_role: official
experiment_id: EXP-173
issue_number: 173
parent_experiment: EXP-094
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
baseline:
  feature_spec: v1
  metrics_path: reports/exp094_feature_spec_v1/metrics.json
variants:
  - name: cellcycle_lof_in_tsg
    added_features: [pathway__cellcycle_lof_in_tsg]
    pathway: Cell Cycle
    og_tsg: TSG
    gene_count: 6
    feature_family: src/open_cancer/pathway_aggregation_features.py::cell_cycle_lof_in_tsg_family
    mutation_types: [nonsense, frameshift]
    # Not a runtime dependency: data/external/gene_pathway_mapping.csv (Issue
    # #167/#168) is the CSV this gene list was originally extracted from, but
    # it is gitignored (CC BY-NC-ND, not redistributable) and is never read
    # at experiment runtime. The runtime/reproducible source of truth is the
    # committed knowledge file below, whose own source_file_sha256 field
    # records the original licensed workbook's hash for provenance.
    knowledge_file: knowledge/tcga_pancanatlas_table_s3_cell_cycle_v1.json
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
acceptance:
  min_macro_f1_delta: 0.001
  max_fold_std_delta: 0.002
  require_no_log_loss_regression: true
  require_no_per_class_f1_regression: true
watch_classes:
  - DLBC
  - LAML
