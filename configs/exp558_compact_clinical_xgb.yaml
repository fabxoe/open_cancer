run_mode: experiment
record_role: official
experiment_id: EXP-558
issue_number: 558
slug: compact_clinical_xgb
parent_experiment: EXP-005
component_experiments: [EXP-003, EXP-005]
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mutation_type:
    enabled: true
  robust_aggregates: []
  residue_position:
    enabled: false
hotspots:
  table: none
  evidence_scope: none
  minimum_matching_train_rows: 1
compact_clinical_features:
  enabled: true
  definition_version: 1.0.0
  semantic_authority: parser_v4
  fit_scope: fold_train
  hotspot_min_patient_count: 5
  recurrent_support_unit: unique_patient
  recurrent_key: gene_reference_position_alternate
  blocks:
    - mutated_gene_presence
    - truncating_gene_presence
    - recurrent_missense_gene_presence
    - compact_patient_summaries
  test_distribution_used_for_fit: false
  target_used_for_fit: false
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: non_string_or_blank_is_unobserved_not_wt
  feature_types: [compact_clinical_mutation]
notes: >-
  Issue #558. Reproduce the shared compact clinical feature architecture while
  retaining parser-v4 as the semantic authority. Every vocabulary and exact
  recurrent missense key is fitted inside the outer-train fold. All historical
  base features constructed by the common runner are dropped before fitting.
comparison_metrics_path: reports/exp005_xgb_mutation_features/metrics.json
