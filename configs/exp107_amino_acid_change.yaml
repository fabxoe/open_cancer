run_mode: experiment
record_role: official
slug: amino_acid_change
parent_experiment: EXP-094
component_experiments:
  - EXP-094
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mutation_type:
    enabled: true
  robust_aggregates:
    - sample__mutated_gene_count_log1p
    - sample__total_variant_count_log1p
    - sample__multi_variant_gene_count_log1p
  residue_position:
    enabled: true
    aggregates:
      - max
    missing_policy: zero
    complex_tokens: include
    transform: raw
hotspots:
  table: extended_34
  evidence_scope: additions_15
  minimum_matching_train_rows: 5
abc_families:
  amino_acid_change:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    property_file: knowledge/amino_acid_properties_v1.json
    features:
      - sample__aa_conservative_substitution_count
      - sample__aa_nonconservative_substitution_count
      - sample__aa_charge_change_count
      - sample__aa_polarity_change_count
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - feature_spec_v1
    - amino_acid_property_transition_counts
notes: >-
  Single-family ablation against frozen EXP-094. Four deterministic sample-level
  counts summarize conservative, nonconservative, charge-changing, and
  polarity-changing simple amino-acid substitutions. Stop gains and complex
  tokens are not added because existing mutation-type features already encode them.
comparison_metrics_path: reports/exp094_feature_spec_v1/metrics.json
