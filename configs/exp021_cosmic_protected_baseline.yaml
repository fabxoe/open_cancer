experiment:
  slug: cosmic_protected_baseline

# 아래에 적지 않은 값은 src/open_cancer/xgb_baseline.py의 기본값을 사용합니다.
# 실제 적용값 전체는 실행 후 config.resolved.yaml에 자동 저장됩니다.
#
# EXP-003(#3)과 하이퍼파라미터·split·seed를 동일하게 유지하고, 피처만
# EXP-012(#12)에서 확정한 COSMIC CGC v104 "protect" 유전자(361개)로
# 제한해 비교합니다.
#
# gene_whitelist_path 파일은 COSMIC 라이선스 미확정으로 Git에 없습니다.
# docs/EXP-012_handoff.md 4절 절차대로 로컬에서 재현한 뒤 실행하세요.
features:
  encoding: mutation_presence
  include_mutation_burden: false
  gene_whitelist_path: reports/exp012_feature_analysis/protected_genes_final.csv

model:
  use_balanced_sample_weight: false
