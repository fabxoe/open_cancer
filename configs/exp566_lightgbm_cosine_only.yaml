run_mode: experiment
record_role: official
experiment_id: EXP-566
issue_number: 566
slug: exp566_lightgbm_cosine_only
parent_experiment: EXP-527
component_experiments: []
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mode: class_cosine_26_only
  excluded: parser_v4_parent_model_columns
model:
  name: lightgbm
  parameters:
    n_estimators: 1200
    learning_rate: 0.03
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_alpha: 0.0
    reg_lambda: 1.0
    early_stopping_rounds: 60
    checkpoint_selection: macro_f1_validation
    n_jobs: 8
    verbosity: -1
    deterministic: true
    force_col_wise: true
training:
  balanced_sample_weight: true
notes: >-
  Issue #566, Task #564. Only EXP-527's leakage-safe leave-one-out 26-class
  cosine scores enter LightGBM; all parser-v4 parent model columns are
  excluded. Settings are fixed across EXP-565/566/567.
comparison_metrics_path: reports/exp527_parser_v4_class_cosine_loo/metrics.json
