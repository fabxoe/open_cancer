notes: >-
  Issue #334. EXP-285 canonical folds, fold-specific model parameters,
  checkpoint policy, class weighting, mutation features, pathway families,
  hotspots, and sample aggregates are held fixed. The sole change is the
  EXP-313 frozen Ensembl release 116 semantic mask on residue-position
  contributions. EXP-285 parameters are read from hash-verified outer-fold
  Optuna summaries without retuning on the masked features. Target, test
  distribution, and Public LB do not define or select the mask or parameters.
