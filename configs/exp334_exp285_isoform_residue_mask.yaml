    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    groups: 10
    values:
      - mutated_gene_count
      - lof_gene_count
    output_dimension: 20
  pathway_mutation_type_composition:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    groups: 10
    values:
      - missense_gene_count
      - synonymous_gene_count
      - nonsense_gene_count
      - frameshift_gene_count
      - complex_gene_count
    candidate_output_dimension: 50
    semantic_equivalence_filter: fold_train_against_feature_spec_v1
