run_mode: experiment
record_role: official
experiment_id: EXP-545
issue_number: 545
slug: hierarchical_tfidf_linear
parent_experiment: EXP-541
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  tokenizer: canonical_event_tokenizer_v1
  adapter: hierarchical_event_adapter_v1
  position_bin_width: 100
  detail_minimum_patient_support: 2
  global_minimum_patient_support: 1
  normalization: raw
  tfidf:
    norm: l2
    use_idf: true
    smooth_idf: true
    sublinear_tf: false
model:
  class: sklearn.svm.LinearSVC
  C: 1.0
  class_weight: balanced
  dual: auto
  max_iter: 10000
  random_state: 42
training:
  checkpoint_selection: fitted_linear_model
  primary_metric: macro_f1
  class_order: project_constant
notes: >-
  Issue #545. Parser-v4 hierarchical detail/global vocabulary and TF-IDF are
  fitted in each outer-train scope only. Validation and test are transform-only.
  This is the final pre-registered sparse-linear ablation after EXP-539/541.
