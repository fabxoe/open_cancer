run_mode: experiment
record_role: official
experiment_id: EXP-567
issue_number: 567
slug: exp567_lightgbm_parser_cosine
parent_experiment: EXP-527
component_experiments: []
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mode: parser_v4_parent_plus_class_cosine_26
model:
  name: lightgbm
  parameters:
    n_estimators: 1200
    learning_rate: 0.03
    num_leaves: 31
