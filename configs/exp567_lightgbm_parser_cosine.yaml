    reg_lambda: 1.0
    early_stopping_rounds: 60
    checkpoint_selection: macro_f1_validation
    n_jobs: 8
    verbosity: -1
    deterministic: true
    force_col_wise: true
training:
  balanced_sample_weight: true
notes: >-
  Issue #567, Task #564. EXP-527's full parser-v4 parent features and its
  leakage-safe leave-one-out 26-class cosine scores enter LightGBM. Settings
  are fixed across EXP-565/566/567.
comparison_metrics_path: reports/exp527_parser_v4_class_cosine_loo/metrics.json
