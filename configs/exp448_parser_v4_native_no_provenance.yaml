run_mode: experiment
record_role: official
experiment_id: EXP-448
issue_number: 448
slug: parser_v4_native_no_provenance
parent_experiment: EXP-438
component_experiments: []
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
parser_baseline:
  representation: native_no_provenance
features:
  mutation_type: {enabled: true}
  robust_aggregates: []
  residue_position: {enabled: false}
hotspots:
  table: none
  evidence_scope: none
  minimum_matching_train_rows: 1
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - mutation_presence
    - parser_v4_native_consequence
notes: >-
  EXP-438 native schema with only the six sample-level parse-status and
  frameshift-grammar provenance summaries removed. Consequence features remain.
