model:
  class: sklearn.svm.LinearSVC
  C: 1.0
  class_weight: balanced
  dual: auto
  max_iter: 10000
  random_state: 42
training:
  checkpoint_selection: fitted_linear_model
  primary_metric: macro_f1
  class_order: project_constant
notes: >-
  Issue #539. First official canonical 5-fold baseline for the parser-v4
  hierarchical detail/global event-token adapter. Vocabulary fitting is
  outer-train only. No row normalization or TF-IDF is applied.
