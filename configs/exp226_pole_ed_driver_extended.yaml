run_mode: experiment
record_role: official
experiment_id: EXP-226
issue_number: 226
parent_experiment: EXP-094
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
baseline:
  feature_spec: v1
  metrics_path: reports/exp094_feature_spec_v1/metrics.json
variants:
  - name: pole_ed_driver_extended
    added_features: [pole__ed_driver_extended]
    gene: POLE
    hotspot_count: 21
    feature_family: src/open_cancer/pole_ed_features.py::pole_ed_driver_extended_family
    domain_basis: Vera Health consultation (2026-08-02) + POLE ED hotspot literature
scope: >-
  Confirmatory experiment (#226), not a performance-optimization attempt.
  Primary question: does the COAD F1 direction from D (EXP-181, +0.0051)
  reproduce at a slightly larger sample (22 -> 28 positive rows)? Official
  single-seed run only -- no multi-seed stability check (that budget was
  spent on D already; this is a confirmation, not a new stability claim).
watch_classes:
  - COAD
  - UCEC
  - DLBC
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
acceptance:
  min_macro_f1_delta: 0.001
  max_fold_std_delta: 0.002
  require_no_log_loss_regression: true
  require_no_per_class_f1_regression: true
  note: "Gate result is recorded but is not the deciding factor for this confirmatory run -- see scope."
