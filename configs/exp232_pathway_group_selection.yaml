run_mode: experiment
record_role: official
experiment_id: EXP-232
issue_number: 232
slug: pathway_group_selection
parent_experiment: EXP-229
component_experiments:
  - EXP-094
  - EXP-096
  - EXP-219
  - EXP-223
  - EXP-229
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mutation_type:
    enabled: true
  robust_aggregates:
    - sample__mutated_gene_count_log1p
    - sample__total_variant_count_log1p
    - sample__multi_variant_gene_count_log1p
  residue_position:
    enabled: true
    aggregates:
      - max
    missing_policy: zero
    complex_tokens: include
    transform: raw
hotspots:
  table: extended_34
  evidence_scope: additions_15
  minimum_matching_train_rows: 5
external_knowledge:
  file: knowledge/canonical_pathways_sanchez_vega_v1.json
  organizer_approval_reference: https://github.com/fabxoe/open_cancer/issues/96#issuecomment-5151028180
  source_commit: 7d29965de6ac8d0c6ec18c383f6dff8a48d562e7
  source_sha256: a625675d03fa314eb27f3ab731524de13621a35aecd8edb7c67878f2d89ae07a
abc_families:
  fixed_pathway_burden:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    output_dimension: 20
  pathway_mutation_type_composition:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    candidate_output_dimension: 50
  pathway_group_permutation_selector:
    enabled: true
    fit_scope: outer_fold_train_only
    grouping: pathway
    inner_folds: 3
    permutation_repeats: 3
    minimum_positive_inner_folds: 2
    minimum_mean_macro_f1_delta: 0.0
    seed: 232
  functional_role_burden:
    enabled: false
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - feature_spec_v1
    - fixed_pathway_mutated_and_lof_gene_counts
    - selected_fixed_pathway_mutation_type_gene_counts
notes: >-
  Issue #232. Within each outer-fold training partition, three inner stratified
  folds estimate joint pathway-group permutation importance. A pathway is kept
  only when its mean Macro-F1 delta is positive in at least two inner folds and
  positive overall. Outer validation, test, and Public LB never select groups.
comparison_metrics_path: reports/exp229_pathway_mutation_types/metrics.json
