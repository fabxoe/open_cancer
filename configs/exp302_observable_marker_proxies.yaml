run_mode: experiment
record_role: official
experiment_id: EXP-302
issue_number: 302
slug: observable_marker_proxies
parent_experiment: EXP-229
component_experiments:
  - EXP-094
  - EXP-096
  - EXP-219
  - EXP-223
  - EXP-229
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
features:
  mutation_type:
    enabled: true
  robust_aggregates:
    - sample__mutated_gene_count_log1p
    - sample__total_variant_count_log1p
    - sample__multi_variant_gene_count_log1p
  residue_position:
    enabled: true
    aggregates:
      - max
    missing_policy: zero
    complex_tokens: include
    transform: raw
hotspots:
  table: extended_34
  evidence_scope: additions_15
  minimum_matching_train_rows: 5
external_knowledge:
  file: knowledge/canonical_pathways_sanchez_vega_v1.json
  organizer_approval_reference: https://github.com/fabxoe/open_cancer/issues/96#issuecomment-5151028180
  source_commit: 7d29965de6ac8d0c6ec18c383f6dff8a48d562e7
  source_sha256: a625675d03fa314eb27f3ab731524de13621a35aecd8edb7c67878f2d89ae07a
marker_external_knowledge:
  file: knowledge/fixed_observable_cancer_markers_v1.json
  definition_version: 1.0.0
  fit_scope: stateless
  panels: 5
  candidate_output_dimension: 20
  semantic_equivalence_filter: fold_train_against_exp229_base
  minimum_fold_train_positive_count: 5
  interpretation: mutation_proxy_not_clinical_biomarker
abc_families:
  fixed_pathway_burden:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    groups: 10
    values:
      - mutated_gene_count
      - lof_gene_count
    output_dimension: 20
  pathway_mutation_type_composition:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    groups: 10
    values:
      - missense_gene_count
      - synonymous_gene_count
      - nonsense_gene_count
      - frameshift_gene_count
      - complex_gene_count
    candidate_output_dimension: 50
    semantic_equivalence_filter: fold_train_against_feature_spec_v1
  observable_marker_proxies:
    enabled: true
    definition_version: 1.0.0
    fit_scope: stateless
    candidate_output_dimension: 20
    values:
      - any_mutated
      - any_nonsynonymous
      - any_lof
      - multi_gene_mutated
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cpu
  n_jobs: 8
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - exp229_frozen_features
    - fixed_observable_marker_mutation_proxies
notes: >-
  Issue #302. EXP-229 features, XGBoost parameters, balanced sample weight,
  validation Macro-F1 checkpoint selection, seed, and canonical folds are held
  fixed. The sole candidate change is adding the target-independent observable
  marker mutation proxies frozen in Issue #299. Fusion, amplification, MSI/dMMR,
  germline status, target, test distribution, and Public LB do not define or
  select features.
comparison_metrics_path: reports/exp229_pathway_mutation_types/metrics.json
