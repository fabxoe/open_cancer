run_mode: experiment
record_role: official
experiment_id: EXP-487
issue_number: 487
slug: native_v3_nested_xgb_tuning
parent_experiment: EXP-479
component_experiments: []
seed: 42
split:
  path: data/splits/stratified_5fold_seed42.csv
  n_splits: 5
parser_baseline:
  representation: native_v3_semantic_range
features:
  mutation_type: {enabled: true}
  robust_aggregates: []
  residue_position: {enabled: false}
hotspots:
  table: none
  evidence_scope: none
  minimum_matching_train_rows: 1
model:
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  gamma: 0.0
  eval_metric: mlogloss
  early_stopping_rounds: 30
  tree_method: hist
  device: cuda
  n_jobs: 12
  verbosity: 0
training:
  balanced_sample_weight: true
  checkpoint_selection: macro_f1_validation
  missing_policy: separate per-gene and per-sample missing indicators
  feature_types:
    - mutation_presence
    - parser_v4_native_semantic_range_consequence_token_count
nested_optuna:
  enabled: true
  fit_scope: outer_train_inner_cv_only
  inner_n_splits: 3
  n_trials_per_outer_fold: 30
  sampler: TPE
  sampler_seed_policy: 42_plus_outer_fold
  objective: inner_oof_macro_f1
  best_trial_tie_break: minimum_inner_macro_f1_std_then_trial_number
  search_space:
    max_depth: [3, 7]
    min_child_weight: [2.0, 20.0]
    subsample: [0.6, 0.9]
    colsample_bytree: [0.25, 0.75]
    reg_alpha: [0.0, 2.0]
    reg_lambda: [1.0, 12.0]
    learning_rate: [0.02, 0.08, log]
    gamma: [0.0, 0.5]
  forbidden_selection_inputs:
    - outer_validation
    - test
    - public_leaderboard
notes: >-
  Issue #487. EXP-479 parser contract, native-v3 semantic schema, mutation
  presence, sample token-count aggregation, gene consequence presence,
  canonical folds, balanced sample weighting and Macro-F1 checkpoint policy
  are fixed. Hyperparameters are selected only by 3-fold CV inside each outer
  training partition. The search space was frozen from Issue #475 diagnostics;
  test-domain AUC and Public LB do not select trials, parameters or features.
comparison_metrics_path: reports/exp479_parser_v4_native_semantic_range/metrics.json
